name: Crear apps (.exe y .apk)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar archivos
        shell: bash
        run: |
          mkdir www build
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/
          cp icon-512.png build/icon.png
      - name: Crear electron/main.js
        shell: bash
        run: |
          mkdir -p electron
          cat > electron/main.js <<'EOF'
          const { app, BrowserWindow, Menu } = require('electron');
          const path = require('path');
          app.commandLine.appendSwitch('enable-features', 'HardwareMediaKeyHandling,MediaSessionService');
          app.commandLine.appendSwitch('autoplay-policy', 'no-user-gesture-required');
          function crear() {
            const w = new BrowserWindow({
              width: 1100, height: 720, minWidth: 380, minHeight: 560,
              backgroundColor: '#101126', autoHideMenuBar: true,
              icon: path.join(__dirname, '..', 'www', 'icon-512.png'),
              webPreferences: { contextIsolation: true }
            });
            Menu.setApplicationMenu(null);
            w.loadFile(path.join(__dirname, '..', 'www', 'index.html'));
          }
          app.whenReady().then(crear);
          app.on('window-all-closed', () => app.quit());
          EOF
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar archivos
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/
      - run: npm install --ignore-scripts
      - run: npx cap add android
      - name: Poner el icono
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png $R/mipmap-$d/$n.png
            done
          done
      - run: npx cap sync android
      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Bluebell.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Bluebell.apk
