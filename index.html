.set{padding:8px 16px 20px}.tabs{padding:0 16px 8px}
}
#splash{position:fixed;inset:0;z-index:50;background:#080a16;display:grid;place-items:center;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.nosplash #splash{display:none}
.sp-in{position:relative;display:grid;justify-items:center;gap:20px}
.sp-in img{width:104px;height:104px;animation:spin .75s cubic-bezier(.2,.9,.3,1.15) both}
.sp-in b{color:#eef0ff;font:800 24px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em;animation:fup .6s .3s both}
.sp-ring{position:absolute;top:0;width:104px;height:104px;border-radius:50%;border:2px solid #5b9dff;opacity:0;animation:ring 1.3s .35s ease-out}
@keyframes spin{0%{transform:scale(.45) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fup{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(2.4);opacity:0}}
</style>
</head>
<body>
<div id="splash"><div class="sp-in"><span class="sp-ring"></span><img src="icon.svg" alt="" width="104" height="104"><b>Bluebell</b></div></div>

<script>
const IC={play:'M8 5v14l11-7z',pause:'M7 5h4v14H7zM13 5h4v14h-4z',prev:'M6 5h2v14H6zM20 5v14L9 12z',next:'M16 5h2v14h-2zM4 5v14l11-7z',
shuf:'M16 4h4v4M4 20L20 4M20 16v4h-4M4 4l5 5M15 15l5 5',rep:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',
heart:'M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',
trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',lib:'M4 4v16M9 4v16M14 6l5 14',list:'M4 6h16M4 12h16M4 18h10',queue:'M4 6h12M4 12h12M4 18h8M18 14v6l4-3z',vol:'M4 9v6h4l5 4V5L8 9zM17 8a5 5 0 010 8',back:'M3 12a9 9 0 109-9M3 4v5h5',fwd:'M21 12a9 9 0 11-9-9M21 4v5h-5',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',chev:'M6 9l6 6 6-6',more:'M12 5a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2zM12 10.4a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2zM12 15.8a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2z',expand:'M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7',clock:'M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18z',home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',note:'M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z',users:'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2 20c0-3.3 3-6 7-6s7 2.7 7 6M17 5.5a3 3 0 010 5.8M18.5 14.5c2.2.7 3.5 2.6 3.5 5',disc:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 9a3 3 0 100 6 3 3 0 000-6z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',menu:'M4 6h16M4 12h16M4 18h16',arrow:'M5 12h14M13 6l6 6-6 6',gear:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" class="ic${f?' f':''}"><use href="#i-${n}"/></svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const S={songs:[],pls:[],view:'home',q:'',base:[],order:[],qi:-1,shuf:false,rep:0,vol:1,shown:[],byId:new Map(),ready:false,lim:100,ui:{},themes:[],tab:'gen',dynCol:null};
const FF={outfit:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',sys:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const UI0={theme:'system',ac:'',bg:'',pn:'',tx:'',ff:'sys',r:14,den:6,fs:15,cov:'grad',cvs:44,cr:'8',sbp:'left',sbw:232,dur:true,skip:false,step:10,rem:false,auto:true,spd:1,pp:true,fin:0,fout:0,e0:0,e1:0,e2:0,e3:0,e4:0,boost:100,bal:0,mono:false,css:'',dyn:'off',dynw:'ac',lang:'en',splash:true};
function applyUI(){const u=S.ui,r=document.documentElement;
  if(u.theme==='system')r.removeAttribute('data-theme');else r.dataset.theme=u.theme;
  if(u.ac){const n=parseInt(u.ac.slice(1),16),l=((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000;r.style.setProperty('--ac',u.ac);r.style.setProperty('--on',l>150?'#111':'#fff')}else{r.style.removeProperty('--ac');r.style.removeProperty('--on')}
  r.style.setProperty('--ff',FF[u.ff]||FF.sys);
  r.style.setProperty('--cv',u.cvs+'px');r.style.setProperty('--cr',u.cr==='c'?'50%':u.cr+'px');r.style.setProperty('--sbw',u.sbw+'px');
  r.dataset.sb=u.sbp;r.dataset.cr=u.cr;r.classList.toggle('nocov',u.cov==='none');r.classList.toggle('nodur',!u.dur);r.classList.toggle('skip',!!u.skip);
  [['bg','--bg'],['pn','--pn'],['tx','--tx']].forEach(([k,n])=>u[k]?r.style.setProperty(n,u[k]):r.style.removeProperty(n));
  if(u.pn)r.style.setProperty('--pn2','color-mix(in srgb,'+u.pn+' 88%,'+(u.tx||'#888')+')');else r.style.removeProperty('--pn2');
  const b1=$('#sb');if(b1){b1.title=TR('Rewind {n} s',{n:u.step});$('#sf').title=TR('Forward {n} s',{n:u.step})}r.style.setProperty('--r',u.r+'px');r.style.setProperty('--rp',u.den+'px');r.style.setProperty('--fs',u.fs+'px');
  dynApply(r);userCss()}
S.ui={...UI0};
const A=new Audio();let db=null,url=null,drag=false;

/* almacenamiento local (IndexedDB) */
const dbop=(st,m,f)=>db?new Promise(r=>{try{const t=db.transaction(st,m);f(t.objectStore(st));t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}}):Promise.resolve(false);
const saveP=()=>{try{localStorage.setItem('bb.ui',JSON.stringify(S.ui))}catch(e){}return dbop('kv','readwrite',s=>s.put({pls:S.pls,vol:S.vol,shuf:S.shuf,rep:S.rep,ui:S.ui,themes:S.themes},'prefs'))};
const saveS=s=>db?new Promise(r=>{try{const{blob,...m}=s,t=db.transaction(['songs','blobs'],'readwrite');t.objectStore('songs').put(m);if(blob)t.objectStore('blobs').put({id:s.id,blob});t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}}):Promise.resolve(false);
const getBlob=s=>s.blob?Promise.resolve(s.blob):new Promise(res=>{if(!db)return res(null);try{const r=db.transaction('blobs').objectStore('blobs').get(s.id);r.onsuccess=()=>res(r.result&&r.result.blob);r.onerror=()=>res(null)}catch(e){res(null)}});
function endSplash(){const e=$('#splash');if(!e)return;setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),500)},Math.max(0,950-performance.now()))}
async function migrate(){if(!db)return;for(const s of S.songs){if(s.blob&&await saveS(s))delete s.blob}}
async function init(){
  $('#sp').innerHTML=Object.entries(IC).map(([k,d])=>`<symbol id="i-${k}" viewBox="0 0 24 24"><path d="${d}"/></symbol>`).join('');
  document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,e.dataset.f));
  $('#sh').innerHTML=ic('shuf');$('#sb').innerHTML=ic('back');$('#sf').innerHTML=ic('fwd');$('#pv').innerHTML=ic('prev',1);$('#nx').innerHTML=ic('next',1);
  try{const c=JSON.parse(localStorage.getItem('bb.ui')||'null');if(c)S.ui={...UI0,...c}}catch(e){}
  applyLang();applyUI();render();bar();
  try{db=await new Promise((res,rej)=>{const q=indexedDB.open('mimusica',2);q.onupgradeneeded=()=>{const d=q.result;['songs','blobs'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){db=null;$('#warn').hidden=false}
  if(db)await new Promise(r=>{try{const t=db.transaction(['songs','kv']);t.objectStore('songs').getAll().onsuccess=e=>{S.songs=e.target.result.sort((a,b)=>a.added-b.added)};t.objectStore('kv').get('prefs').onsuccess=e=>{const p=e.target.result;if(p)Object.assign(S,{pls:p.pls||[],vol:p.vol==null?1:p.vol,shuf:!!p.shuf,rep:p.rep||0,ui:{...UI0,...(p.ui||{})},themes:p.themes||[]})};t.oncomplete=r;t.onerror=r}catch(e){r()}});
  S.byId=new Map(S.songs.map(s=>[s.id,s]));S.ready=true;
  A.volume=S.vol;applyLang();applyUI();applyAudio();render();bar();migrate();endSplash();
}

/* canciones */
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const cst=(s,im)=>im?`background:center/cover url(${im})`:s.col?`background:linear-gradient(135deg,${s.col},color-mix(in srgb,${s.col} 55%,#000))`:S.ui.cov==='flat'?'background:var(--ac);color:var(--on)':`background:linear-gradient(135deg,hsl(${hue(s.title)} 65% 52%),hsl(${(hue(s.title)+60)%360} 65% 34%))`;
const cov=(s,big)=>{const im=big?s.img:(s.th||s.img);return `<div class="cov" style="${cst(s,im)}">${im?'':esc([...s.title][0]||'♪')}</div>`};
const pic=s=>s.th||s.img||'';
const cc=(l,img)=>{
  if(img)return `<div class="cc" style="background:center/cover url(${img})"></div>`;
  const im=l.filter(pic).slice(0,4);
  if(im.length>=4)return `<div class="cc g4">${im.map(s=>`<i style="background:center/cover url(${pic(s)})"></i>`).join('')}</div>`;
  if(im.length)return `<div class="cc" style="background:center/cover url(${pic(im[0])})"></div>`;
  const s=l[0];return s?`<div class="cc" style="${cst(s,'')}">${esc([...s.title][0]||'♪')}</div>`:`<div class="cc e">${ic('list')}</div>`;
};
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{r(a.duration);URL.revokeObjectURL(u)};a.onerror=()=>{r(0);URL.revokeObjectURL(u)};a.src=u});
async function readTags(f){
  const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
  if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33||h[3]<3)return{};
  const ver=h[3],ss=b=>(b[0]&127)<<21|(b[1]&127)<<14|(b[2]&127)<<7|(b[3]&127);
  const b=new Uint8Array(await f.slice(10,10+Math.min(ss(h.slice(6,10)),4e6)).arrayBuffer()),r={};let p=0;
  if(h[5]&64)p=ver===4?ss(b.slice(0,4)):(((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])>>>0)+4;
  const dec=(e,d)=>{let t;if(e===1||e===2){let l='utf-16le';if(d[0]===0xFE&&d[1]===0xFF){l='utf-16be';d=d.slice(2)}else if(d[0]===0xFF&&d[1]===0xFE)d=d.slice(2);else if(e===2)l='utf-16be';t=new TextDecoder(l).decode(d)}else{try{t=new TextDecoder('utf-8',{fatal:true}).decode(d)}catch(x){t=new TextDecoder('windows-1252').decode(d)}}return t.split('\0')[0].trim()};
  while(p+10<=b.length){
    const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const sz=ver===4?ss(b.slice(p+4,p+8)):(((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0),d=b.slice(p+10,p+10+sz);p+=10+sz;if(!d.length)continue;
    if(id==='TIT2')r.title=dec(d[0],d.slice(1));else if(id==='TPE1')r.artist=dec(d[0],d.slice(1));else if(id==='TALB')r.album=dec(d[0],d.slice(1));
    else if(id==='APIC'&&!r.pic){const e=d[0];let i=1;while(i<d.length&&d[i])i++;const mime=String.fromCharCode(...d.slice(1,i)).toLowerCase();i+=2;
      if(e===1||e===2){while(i+1<d.length&&(d[i]||d[i+1]))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
      const img=d.slice(i);if(img.length>100)r.pic=new Blob([img],{type:/png/.test(mime)?'image/png':'image/jpeg'})}
  }
  return r;
}
async function add(files){
  let n=0;
  for(const f of files){
    if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|flac|ogg|opus|wav|aac|webm)$/i.test(f.name))continue;
    const nm=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim(),m=nm.split(' - ');
    let title=m.length>1?m.slice(1).join(' - ').trim():nm,artist=m.length>1?m[0].trim():'Unknown artist',album='',im=null;
    if(/\.mp3$/i.test(f.name)||f.type==='audio/mpeg'){try{const t=await readTags(f);if(t.title)title=t.title;if(t.artist)artist=t.artist;if(t.album)album=t.album;if(t.pic)im=await readImg(t.pic)}catch(e){}}
    const s={id:uid(),title,artist,blob:f,dur:await dur(f),liked:false,added:Date.now()+S.songs.length};
    if(album)s.album=album;if(im&&im[0]){s.img=im[0];s.th=im[1]}
    S.songs.push(s);S.byId.set(s.id,s);if(await saveS(s))delete s.blob;
    if(++n%10===0)render();
  }
  render();
}
const find=id=>S.byId.get(id);
const cur=()=>find(S.order[S.qi]);
function items(all){
  const v=S.view;let l=S.songs;
  if(v==='liked')l=l.filter(s=>s.liked);
  else if(v==='queue')l=S.order.map(find).filter(Boolean);
  else if(v.startsWith('pl:')){const p=S.pls.find(p=>p.id===v.slice(3));l=p?p.ids.map(find).filter(Boolean):[]}
  else if(v.startsWith('a:'))l=l.filter(s=>ak(s)===v.slice(2));
  else if(v.startsWith('al:'))l=l.filter(s=>(s.album||'')===v.slice(3));
  else if(v.startsWith('m:'))l=l.filter(s=>mon(s)===v.slice(2));
  const q=all?'':S.q.toLowerCase();return q?l.filter(s=>(s.title+' '+s.artist+' '+(s.album||'')).toLowerCase().includes(q)):l;
}

async function load(){

  if(cur()!==s)return;
  if(!b){toast(TR('Could not read this file'));return}
  s.plays=(s.plays||0)+1;s.last=Date.now();saveS(s);
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);audioInit();if(ctx&&ctx.state==='suspended')ctx.resume();A.src=url;A.play().catch(()=>{});fadeIn();
  msMeta(s);
  bar();markCur();dynUpdate();
}
function next(auto){

  if(S.qi<S.order.length-1)S.qi++;else if(S.rep===1)S.qi=0;else{if(auto){A.pause();bar()}return}
  load();
}
function prev(){

let ctx,nodes,fo=0,slT,slEnd=false;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;t.hidden=false;clearTimeout(t.k);t.k=setTimeout(()=>t.hidden=true,4000)}
function audioInit(){
  if(ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{ctx=new C();const src=ctx.createMediaElementSource(A);
    const eq=[60,230,910,3600,14000].map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i===0?'lowshelf':i===4?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1;return b});
    const mono=ctx.createGain(),boost=ctx.createGain(),fade=ctx.createGain(),pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    let n=src;[...eq,mono,boost,fade,...(pan?[pan]:[])].forEach(x=>{n.connect(x);n=x});n.connect(ctx.destination);
    nodes={eq,mono,boost,fade,pan};applyAudio();
  }catch(e){ctx=null;nodes=null}
}
function applyAudio(){
  const u=S.ui;A.defaultPlaybackRate=A.playbackRate=+u.spd||1;A.preservesPitch=A.mozPreservesPitch=A.webkitPreservesPitch=u.pp!==false;
  if(!nodes)return;

  if(nodes.pan)nodes.pan.pan.value=+u.bal||0;nodes.mono.channelCount=u.mono?1:2;nodes.mono.channelCountMode='explicit';

function fadeIn(){
  fo=0;if(!nodes)return;const g=nodes.fade.gain,t=ctx.currentTime,d=+S.ui.fin||0;
  g.cancelScheduledValues(t);g.setValueAtTime(d>0?0:1,t);if(d>0)g.linearRampToValueAtTime(1,t+d);

function fadeTick(){

  if(!fo&&rem<=f&&rem>.2){fo=1;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+rem)}
  else if(fo&&rem>f+.5){fo=0;g.cancelScheduledValues(t);g.setValueAtTime(1,t)}

function setSleep(v){
  clearTimeout(slT);slEnd=v==='end';S.sleep=v;if(+v>0)slT=setTimeout(sleepNow,v*60000);

  if(nodes&&!A.paused){const g=nodes.fade.gain,t=ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+4);setTimeout(done,4200)}else done();

const hslOf=h=>{const n=parseInt(h.slice(1),16);let[r,g,b]=[n>>16,n>>8&255,n&255].map(x=>x/255);const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let H=0;if(d){H=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;H=Math.round(H*60);if(H<0)H+=360}const L=(M+m)/2;return[H,Math.round((d?d/(1-Math.abs(2*L-1)):0)*100),Math.round(L*100)]};
const isDark=()=>S.ui.theme==='dark'||(S.ui.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
const imgColor=src=>new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(im,0,0,32,32);const d=x.getImageData(0,0,32,32).data,B=Array.from({length:24},()=>({w:0,s:0}));
  for(let i=0;i<d.length;i+=4){const[h,sa,l]=hslOf('#'+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,'0')).join(''));const w=(sa/100)*(1-Math.abs(l-50)/50),b=B[Math.floor(h/15)%24];b.w+=w;b.s+=sa*w}
  let k=0;B.forEach((b,i)=>{if(b.w>B[k].w)k=i});res(B[k].w>.5?{h:k*15+7,s:Math.round(B[k].s/B[k].w)}:null)}catch(e){res(null)}};im.onerror=()=>res(null);im.src=src});

  r.style.setProperty('--ac',`hsl(${c.h} ${sa}% ${la}%)`);r.style.setProperty('--on',dk?'#111':'#fff');

      else if(k==='cr'){if(['0','8','c'].includes(v))u[k]=v}
      else if(k==='sbp'){if(['left','right'].includes(v))u[k]=v}
      else if(typeof v==='number'){if(isFinite(v)){const[a,b]=RG[k]||[0,1];u[k]=Math.min(b,Math.max(a,v))}}
      else if(typeof v==='boolean')u[k]=v}
    S.themes.push({id:uid(),n:String(j.n||'Tema importado').slice(0,40),u,c:cssSafe(j.c||'')});saveP();toast(TR('Theme imported'));render();
  }catch(e){toast(TR('That code is not valid'))}
}
function themeAct(a){
  const[k,id]=a.split(':'),t=S.themes.find(x=>x.id===id);

  else if(k==='u'&&t)setTheme(t);
  else if(k==='x'&&t){S.out=exportT(t);if(navigator.clipboard)navigator.clipboard.writeText(S.out).then(()=>toast(TR('Code copied')),()=>{});render()}
  else if(k==='d'&&t)sheet(TR('Delete the theme “{n}”?',{n:t.n}),[{label:TR('Delete'),bad:1,fn:()=>{S.themes=S.themes.filter(x=>x!==t);saveP();render()}}]);
  else if(k==='save'){const n=($('#tn').value||'').trim();if(!n){toast(TR('Name your theme'));return}const u={};THK.forEach(q=>u[q]=S.ui[q]);S.themes.push({id:uid(),n:n.slice(0,40),u,c:S.ui.css||''});saveP();toast(TR('Theme saved'));render()}

}

const readImg=f=>new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),mk=n=>{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);return c.toDataURL('image/jpeg',.82)};const r=[mk(256),mk(96)];URL.revokeObjectURL(u);res(r)};im.onerror=()=>{URL.revokeObjectURL(u);res(['',''])};im.src=u});

<button class="nav" id="es">${TR('Save')}</button><button class="nav" id="eq">${TR('Cancel')}</button></div>`;

}

  const by=[...S.songs].sort((a,b)=>(b.plays||0)-(a.plays||0)),top=by[0],hp=top.plays>0;
  let recs=S.songs.slice(0,5);
  if(hp){const a=ak(top);recs=[top,...by.filter(s=>s!==top&&ak(s)===a),...by.filter(s=>s!==top&&ak(s)!==a)].slice(0,5)}

  const rec=S.songs.filter(s=>s.last).sort((a,b)=>b.last-a.last).slice(0,12),mo=[...grp(S.songs,mon)].sort((a,b)=>a[0]<b[0]?1:-1);

   +sec(TR('Monthly playlists'))+`<div class="car">${mo.map(([k,l])=>card('m:'+k,cc(l),k,'',l.length,'w')).join('')}</div>`
   +(ar.length?sec(TR('Top artists'))+`<div class="tops">${ar.map((x,i)=>`<button class="tp" data-go="a:${esc(x.n)}"><span class="rk">${i+1}</span>${avs(x.l)}<div class="t"><b>${esc(x.n)}</b><span>${TR('{n} songs',{n:x.l.length})}</span></div></button>`).join('')}</div>`:'')
   +(S.pls.length?sec(TR('Your playlists'),`<button class="sq" data-go="lists" aria-label="${TR('See all')}">${ic('arrow')}</button>`)+`<div class="car">${S.pls.map(p=>card('pl:'+p.id,cc(plSongs(p),p.th),p.name,TR('{n} songs',{n:p.ids.length}))).join('')}</div>`:'');

  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.shiftKey?next(false):A.currentTime+=+S.ui.step}
  else if(e.key==='ArrowLeft'){e.shiftKey?prev():A.currentTime-=+S.ui.step}
  else if(e.key==='ArrowUp'&&e.target.type!=='range'){S.vol=Math.min(1,S.vol+.05);A.volume=S.vol;bar()}
  else if(e.key==='ArrowDown'&&e.target.type!=='range'){S.vol=Math.max(0,S.vol-.05);A.volume=S.vol;bar()}
});

$('#xp').onclick=()=>{if(cur())openNP()};$('#mu').onclick=()=>{A.muted=!A.muted;$('#mu').classList.toggle('on',A.muted)};

init();
